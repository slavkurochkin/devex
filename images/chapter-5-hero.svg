<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ink field -->
  <rect x="0" y="0" width="1200" height="400" fill="#14161C"/>

  <!-- accent field, slanted edge -->
  <polygon points="742,0 1200,0 1200,400 682,400" fill="#FF5A36"/>

  <!-- ── left: type ───────────────────────────────────────── -->
  <text class="sans" x="80" y="118" fill="#FF5A36" font-size="19" font-weight="700" letter-spacing="7.5">CHAPTER FIVE</text>

  <text class="sans" x="80" y="200" fill="#F7F4EF" font-size="50" font-weight="700" letter-spacing="-0.8">Better Isn&#8217;t a Reason</text>

  <rect x="80" y="240" width="104" height="4" fill="#FF5A36"/>

  <text class="sans" x="80" y="290" fill="#9AA1AE" font-size="18" font-weight="400">Better is a fact. Worth switching is a decision.</text>

  <!-- ── right: the gap we closed without leaving ─────────── -->
  <g fill="#14161C">
    <!-- before: two hours -->
    <text class="sans" x="792" y="177" fill="#14161C" font-size="15" font-weight="700" text-anchor="end">2h</text>
    <rect x="806" y="155" width="340" height="34" rx="4" fill="none" stroke="#14161C" stroke-width="3"/>

    <!-- after: fifteen minutes, same framework -->
    <text class="sans" x="792" y="242" fill="#14161C" font-size="15" font-weight="700" text-anchor="end">15m</text>
    <rect x="806" y="220" width="43" height="34" rx="4"/>
  </g>
</svg>
