<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ink field -->
  <rect x="0" y="0" width="1200" height="400" fill="#14161C"/>

  <!-- accent field, slanted edge -->
  <polygon points="742,0 1200,0 1200,400 682,400" fill="#FF5A36"/>

  <!-- ── left: type ───────────────────────────────────────── -->
  <text class="sans" x="80" y="118" fill="#FF5A36" font-size="19" font-weight="700" letter-spacing="7.5">CHAPTER ONE</text>

  <text class="sans" x="80" y="190" fill="#F7F4EF" font-size="50" font-weight="700" letter-spacing="-0.8">Don&#8217;t Fall in Love</text>
  <text class="sans" x="80" y="246" fill="#F7F4EF" font-size="50" font-weight="700" letter-spacing="-0.8">With Your Framework</text>

  <rect x="80" y="282" width="104" height="4" fill="#FF5A36"/>

  <text class="sans" x="80" y="324" fill="#9AA1AE" font-size="18" font-weight="400">Your framework is not your identity.</text>

  <!-- ── right: monolith becoming modules ─────────────────── -->
  <g fill="#14161C">
    <!-- monolith -->
    <rect x="806" y="150" width="88" height="100" rx="3"/>
    <text class="sans" x="850" y="278" fill="#14161C" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">MINE</text>

    <!-- arrow -->
    <rect x="912" y="197" width="42" height="6"/>
    <polygon points="954,190 970,200 954,210"/>

    <!-- modules -->
    <g>
      <rect x="990" y="160" width="34" height="34" rx="3"/>
      <rect x="1036" y="160" width="34" height="34" rx="3" fill="none" stroke="#14161C" stroke-width="3"/>
      <rect x="1082" y="160" width="34" height="34" rx="3" fill="none" stroke="#14161C" stroke-width="3"/>
      <rect x="990" y="206" width="34" height="34" rx="3" fill="none" stroke="#14161C" stroke-width="3"/>
      <rect x="1036" y="206" width="34" height="34" rx="3"/>
      <rect x="1082" y="206" width="34" height="34" rx="3" fill="none" stroke="#14161C" stroke-width="3"/>
    </g>
    <text class="sans" x="1053" y="278" fill="#14161C" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">OURS</text>
  </g>
</svg>
