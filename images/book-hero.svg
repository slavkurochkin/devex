      <rect x="1082" y="171" width="14" height="14" rx="2"/>
      <rect x="1104" y="171" width="14" height="14" rx="2"/>

      <rect x="950" y="193" width="14" height="14" rx="2"/>
      <rect x="972" y="193" width="14" height="14" rx="2"/>
      <rect x="994" y="193" width="14" height="14" rx="2"/>
      <rect x="1016" y="193" width="14" height="14" rx="2"/>
      <rect x="1038" y="193" width="14" height="14" rx="2"/>
      <rect x="1060" y="193" width="14" height="14" rx="2"/>
      <rect x="1082" y="193" width="14" height="14" rx="2"/>
      <rect x="1104" y="193" width="14" height="14" rx="2"/>

      <rect x="950" y="215" width="14" height="14" rx="2"/>
      <rect x="972" y="215" width="14" height="14" rx="2"/>
      <rect x="994" y="215" width="14" height="14" rx="2"/>
      <rect x="1016" y="215" width="14" height="14" rx="2"/>
