<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ink field -->
  <rect x="0" y="0" width="1200" height="400" fill="#14161C"/>

  <!-- accent field, slanted edge -->
  <polygon points="742,0 1200,0 1200,400 682,400" fill="#FF5A36"/>

  <!-- ── left: type ───────────────────────────────────────── -->
  <text class="sans" x="80" y="118" fill="#FF5A36" font-size="19" font-weight="700" letter-spacing="7.5">A BOOK, WRITTEN IN PUBLIC</text>

  <text class="sans" x="80" y="192" fill="#F7F4EF" font-size="54" font-weight="700" letter-spacing="-0.8">Engineering</text>
  <text class="sans" x="80" y="252" fill="#F7F4EF" font-size="54" font-weight="700" letter-spacing="-0.8">Force Multipliers</text>

  <rect x="80" y="288" width="104" height="4" fill="#FF5A36"/>

  <text class="sans" x="80" y="330" fill="#9AA1AE" font-size="18" font-weight="400">Small improvements. Outsized impact.</text>

  <!-- ── right: one small fix × every engineer ────────────── -->
  <g fill="#14161C">
    <!-- the small fix -->
    <rect x="800" y="187" width="26" height="26" rx="3"/>
    <text class="sans" x="813" y="252" fill="#14161C" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">ONE FIX</text>

    <!-- multiply -->
    <g stroke="#14161C" stroke-width="5" stroke-linecap="round">
      <line x1="861" y1="191" x2="881" y2="211"/>
      <line x1="881" y1="191" x2="861" y2="211"/>
    </g>

    <!-- every engineer -->
    <g>
      <rect x="950" y="149" width="14" height="14" rx="2"/>
      <rect x="972" y="149" width="14" height="14" rx="2"/>
      <rect x="994" y="149" width="14" height="14" rx="2"/>
      <rect x="1016" y="149" width="14" height="14" rx="2"/>
      <rect x="1038" y="149" width="14" height="14" rx="2"/>
      <rect x="1060" y="149" width="14" height="14" rx="2"/>
      <rect x="1082" y="149" width="14" height="14" rx="2"/>
      <rect x="1104" y="149" width="14" height="14" rx="2"/>

      <rect x="950" y="171" width="14" height="14" rx="2"/>
      <rect x="972" y="171" width="14" height="14" rx="2"/>
      <rect x="994" y="171" width="14" height="14" rx="2"/>
      <rect x="1016" y="171" width="14" height="14" rx="2"/>
