<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ink field -->
  <rect x="0" y="0" width="1200" height="400" fill="#14161C"/>

  <!-- accent field, slanted edge -->
  <polygon points="742,0 1200,0 1200,400 682,400" fill="#FF5A36"/>

  <!-- ── left: type ───────────────────────────────────────── -->
  <text class="sans" x="80" y="118" fill="#FF5A36" font-size="19" font-weight="700" letter-spacing="7.5">A BOOK, WRITTEN IN PUBLIC</text>

  <text class="sans" x="80" y="192" fill="#F7F4EF" font-size="54" font-weight="700" letter-spacing="-0.8">Engineering</text>
  <text class="sans" x="80" y="252" fill="#F7F4EF" font-size="54" font-weight="700" letter-spacing="-0.8">Force Multipliers</text>

  <rect x="80" y="288" width="104" height="4" fill="#FF5A36"/>

  <text class="sans" x="80" y="330" fill="#9AA1AE" font-size="18" font-weight="400">Small improvements. Outsized impact.</text>

  <!-- ── right: lever and fulcrum ─────────────────────────── -->
  <g fill="#14161C">
    <!-- heavy load, lifted on the short arm -->
    <rect x="822" y="134" width="52" height="52" rx="3"/>

    <!-- beam -->
    <line x1="812" y1="182" x2="1103" y2="228" stroke="#14161C" stroke-width="9" stroke-linecap="round"/>

    <!-- fulcrum -->
    <polygon points="975,210 953,250 997,250"/>

    <!-- ground -->
    <rect x="915" y="252" width="120" height="4" rx="2"/>

    <!-- small effort, pressing the long arm down -->
    <rect x="1086" y="150" width="7" height="54" rx="1"/>
    <polygon points="1079,202 1101,202 1090,218"/>
  </g>
</svg>
