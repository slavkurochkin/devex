<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="240" fill="#14161C"/>
  <rect x="0" y="0" width="8" height="240" fill="#FF5A36"/>

  <!-- ── type ─────────────────────────────────────────────── -->
  <text class="sans" x="80" y="86" fill="#FF5A36" font-size="15" font-weight="700" letter-spacing="6.5">SMALL THING</text>

  <text class="sans" x="80" y="140" fill="#F7F4EF" font-size="36" font-weight="700" letter-spacing="-0.5">zdog</text>

  <text class="sans" x="80" y="176" fill="#9AA1AE" font-size="15" font-weight="400">I was the only person who ever used it.</text>

  <!-- ── a dog, waiting ───────────────────────────────────── -->
  <g fill="#FF5A36">
    <!-- tail -->
    <path d="M1014,120 Q994,104 1002,82" fill="none" stroke="#FF5A36" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <rect x="1010" y="110" width="68" height="50" rx="24"/>
    <!-- legs -->
    <rect x="1022" y="150" width="13" height="26" rx="6"/>
    <rect x="1056" y="150" width="13" height="26" rx="6"/>
    <!-- floppy ear -->
    <ellipse cx="1076" cy="88" rx="8" ry="17" transform="rotate(-30 1076 88)"/>
    <!-- head -->
    <circle cx="1092" cy="100" r="23"/>
    <!-- snout -->
    <rect x="1106" y="102" width="28" height="18" rx="9"/>
  </g>

  <!-- eye and nose, cut out of the dog -->
  <circle cx="1094" cy="94" r="4" fill="#14161C"/>
  <circle cx="1130" cy="109" r="4.5" fill="#14161C"/>

  <!-- ground -->
  <rect x="996" y="176" width="150" height="4" rx="2" fill="#FF5A36" opacity="0.45"/>
</svg>
