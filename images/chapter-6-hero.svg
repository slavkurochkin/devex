<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="#14161C"/>
  <polygon points="742,0 1200,0 1200,400 682,400" fill="#FF5A36"/>

  <!-- ── left: type ───────────────────────────────────────── -->
  <text class="sans" x="80" y="112" fill="#FF5A36" font-size="19" font-weight="700" letter-spacing="7.5">CHAPTER SIX</text>

  <text class="sans" x="80" y="184" fill="#F7F4EF" font-size="42" font-weight="700" letter-spacing="-0.6">You Can&#8217;t Scale by</text>
  <text class="sans" x="80" y="234" fill="#F7F4EF" font-size="42" font-weight="700" letter-spacing="-0.6">Doing Everything Yourself</text>

  <rect x="80" y="270" width="104" height="4" fill="#FF5A36"/>

  <text class="sans" x="80" y="312" fill="#9AA1AE" font-size="18" font-weight="400">Two days if I do it. A week if I explain it.</text>

  <!-- ── right: everything routes through one person ──────── -->
  <g stroke="#14161C" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M796,128 L900,190"/>
    <path d="M796,166 L900,196"/>
    <path d="M796,204 L900,202"/>
    <path d="M796,242 L900,208"/>
    <path d="M796,280 L900,214"/>
  </g>

  <!-- the constraint -->
  <rect x="900" y="176" width="52" height="52" rx="6" fill="#14161C"/>

  <!-- one thread out -->
  <line x1="952" y1="202" x2="1108" y2="202" stroke="#14161C" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1108,192 1130,202 1108,212" fill="#14161C"/>
</svg>
